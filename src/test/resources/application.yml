spring:
  application:
    name: cryptrade
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:cryptrade;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  cache:
    type: none

cryptrade:
  account:
    starting-balance: 100000.00
  pricing:
    coingecko-base-url: https://api.coingecko.com/api/v3
