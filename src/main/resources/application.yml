spring:
  application:
    name: cryptrade
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cryptrade}
    username: ${SPRING_DATASOURCE_USERNAME:cryptrade}
    password: ${SPRING_DATASOURCE_PASSWORD:cryptrade}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

cryptrade:
  wallet:
    starting-balance: 100000.00
  pricing:
    coingecko-base-url: https://api.coingecko.com/api/v3
  validator:
    private-key-base64: ${CRYPTRADE_VALIDATOR_PRIVATE_KEY:}
    public-key-base64: ${CRYPTRADE_VALIDATOR_PUBLIC_KEY:}
  admin:
    address: ${CRYPTRADE_ADMIN_ADDRESS:}
  auth:
    jwt-secret-base64: ${CRYPTRADE_JWT_SECRET:}
