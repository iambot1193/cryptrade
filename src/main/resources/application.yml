spring:
  application:
    name: cryptrade
  datasource:
    url: jdbc:h2:mem:cryptrade;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

cryptrade:
  wallet:
    starting-balance: 100000.00
  pricing:
    coingecko-base-url: https://api.coingecko.com/api/v3
